<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Flux Prompt Generator</title>
  <style>
    body {
      width: 400px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 10px;
      padding: 8px;
      resize: vertical;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 10px;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #result {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background-color: #f9f9f9;
      white-space: pre-wrap;
      display: none;
    }
    .error {
      color: red;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <h2>Flux Prompt Generator</h2>
  <textarea id="input" placeholder="Türkçe açıklamanızı buraya yazın..."></textarea>
  <button id="generate">Prompt Oluştur</button>
  <div id="error" class="error"></div>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
